<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wildcat Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EAF3FB;
    --grid: #C9DCEE;
    --ink: #1B2A52;
    --ink-soft: #4A5B85;
    --tile: #FFFFFF;
    --tile-edge: #1B2A52;
    --blue: #2F5FE0;
    --blue-ink: #FFFFFF;
    --yellow: #FFC93C;
    --yellow-ink: #1B2A52;
    --good: #14804F;
    --good-bg: #DDF4E8;
    --bad: #C2304A;
    --bad-bg: #FDE3E7;
    --info-bg: #FFF3CC;
    --pip-todo: #C9DCEE;
    --power: #7A3FF2;
    --power-ink: #FFFFFF;
    --power-bg: #EBE0FF;
    --streak: #FF8A3D;
    --streak-ink: #1B2A52;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121C36;
      --grid: #1D2B4D;
      --ink: #E8EEFF;
      --ink-soft: #A5B3D6;
      --tile: #1F2F58;
      --tile-edge: #E8EEFF;
      --blue: #5B86FF;
      --blue-ink: #0E1630;
      --yellow: #FFC93C;
      --yellow-ink: #1B2A52;
      --good: #5BD69B;
      --good-bg: #153B2D;
      --bad: #FF8A9C;
      --bad-bg: #44212B;
      --info-bg: #3A3320;
      --pip-todo: #2A3B66;
      --power: #B79CFF;
      --power-ink: #140B33;
      --power-bg: #2B2150;
      --streak: #FF8A3D;
      --streak-ink: #1B2A52;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #121C36;
    --grid: #1D2B4D;
    --ink: #E8EEFF;
    --ink-soft: #A5B3D6;
    --tile: #1F2F58;
    --tile-edge: #E8EEFF;
    --blue: #5B86FF;
    --blue-ink: #0E1630;
    --yellow: #FFC93C;
    --yellow-ink: #1B2A52;
    --good: #5BD69B;
    --good-bg: #153B2D;
    --bad: #FF8A9C;
    --bad-bg: #44212B;
    --info-bg: #3A3320;
    --pip-todo: #2A3B66;
    --power: #B79CFF;
    --power-ink: #140B33;
    --power-bg: #2B2150;
    --streak: #FF8A3D;
    --streak-ink: #1B2A52;
    color-scheme: dark;
  }

  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }

  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: "Atkinson Hyperlegible", "Trebuchet MS", Verdana, sans-serif;
    font-size: 18px;
    line-height: 1.5;
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 18px 48px;
  }

  h1, h2, .num, .btn, .tile {
    font-family: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  }

  .top h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0 0 12px;
    letter-spacing: 0.2px;
  }

  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .pips { display: flex; gap: 6px; }
  .pip {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--pip-todo);
    border: 2px solid var(--ink);
  }
  .pip.current { background: var(--yellow); transform: scale(1.2); }
  .pip.good { background: var(--good); }
  .pip.partial { background: var(--yellow); }
  .pip.miss { background: var(--bad); }
  .score { font-weight: 700; color: var(--ink-soft); font-size: 0.95rem; }
  .score span { color: var(--ink); }

  /* the number tile */
  .tile-row { display: flex; justify-content: center; margin: 22px 0 8px; }
  .tile {
    min-width: 168px;
    padding: 6px 28px 10px;
    text-align: center;
    font-size: 6.5rem;
    line-height: 1.1;
    font-weight: 700;
    background: var(--tile);
    color: var(--ink);
    border: 3px solid var(--tile-edge);
    border-radius: 22px;
    box-shadow: 0 8px 0 var(--tile-edge);
    transform: rotate(-1.5deg);
  }
  .tile.pop { animation: pop 320ms ease-out; }
  @keyframes pop {
    0% { transform: rotate(-6deg) scale(0.8); }
    70% { transform: rotate(-1deg) scale(1.05); }
    100% { transform: rotate(-1.5deg) scale(1); }
  }

  .stage { margin-top: 30px; }
  .prompt {
    font-size: 1.3rem;
    font-weight: 700;
    text-align: center;
    margin: 0 0 16px;
  }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .btn {
    appearance: none;
    cursor: pointer;
    font-size: 1.35rem;
    font-weight: 700;
    padding: 14px 18px;
    border-radius: 16px;
    border: 3px solid var(--tile-edge);
    box-shadow: 0 5px 0 var(--tile-edge);
    transition: transform 80ms ease, box-shadow 80ms ease;
    color: var(--ink);
    background: var(--tile);
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--tile-edge); }
  .btn.prime { background: var(--blue); color: var(--blue-ink); }
  .btn.composite { background: var(--yellow); color: var(--yellow-ink); }
  .btn.go { background: var(--blue); color: var(--blue-ink); width: 100%; }
  .btn.ghost {
    background: transparent;
    box-shadow: none;
    border-width: 2px;
    font-size: 1rem;
    padding: 8px 14px;
    border-radius: 12px;
  }
  .btn.ghost:active { transform: none; }
  .btn:focus-visible, input:focus-visible {
    outline: 4px solid var(--yellow);
    outline-offset: 3px;
  }

  /* equation */
  .eq {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 6px 0 18px;
    flex-wrap: nowrap;
  }
  .eq input {
    width: 92px;
    font-family: "Fredoka", "Trebuchet MS", sans-serif;
    font-size: 2.2rem;
    font-weight: 700;
    text-align: center;
    padding: 6px 4px;
    color: var(--ink);
    background: var(--tile);
    border: 3px solid var(--tile-edge);
    border-radius: 16px;
    -moz-appearance: textfield;
  }
  .eq input::-webkit-outer-spin-button,
  .eq input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .eq .op, .eq .res {
    font-family: "Fredoka", "Trebuchet MS", sans-serif;
    font-size: 2.2rem;
    font-weight: 700;
  }

  .actions { display: flex; gap: 12px; align-items: center; }
  .actions .go { flex: 1; }

  .note {
    margin: 16px 0 0;
    padding: 12px 16px;
    border-radius: 14px;
    border-left: 8px solid var(--ink);
    background: var(--info-bg);
    font-size: 1rem;
  }
  .note.good { background: var(--good-bg); border-left-color: var(--good); }
  .note.bad { background: var(--bad-bg); border-left-color: var(--bad); }
  .note strong { font-family: "Fredoka", "Trebuchet MS", sans-serif; font-size: 1.15rem; }

  .next { margin-top: 18px; }

  /* intro and end screens */
  .panel {
    background: var(--tile);
    border: 3px solid var(--tile-edge);
    border-radius: 22px;
    box-shadow: 0 8px 0 var(--tile-edge);
    padding: 22px 22px 24px;
    margin-top: 20px;
  }
  .panel h2 { margin: 0 0 8px; font-size: 1.6rem; }
  .panel p { margin: 0 0 12px; }
  .defs { display: grid; gap: 10px; margin: 16px 0 22px; }
  .def {
    display: flex; gap: 12px; align-items: baseline;
    padding: 10px 14px; border-radius: 14px; border: 2px solid var(--tile-edge);
  }
  .def b { font-family: "Fredoka", "Trebuchet MS", sans-serif; font-size: 1.15rem; min-width: 98px; }
  .def.p { background: color-mix(in srgb, var(--blue) 18%, var(--tile)); }
  .def.c { background: color-mix(in srgb, var(--yellow) 30%, var(--tile)); }

  .big { font-family: "Fredoka", "Trebuchet MS", sans-serif; font-size: 3.2rem; font-weight: 700; line-height: 1.1; margin: 4px 0 6px; }
  .review { display: grid; gap: 8px; margin: 14px 0 20px; padding: 0; list-style: none; }
  .review li {
    display: flex; gap: 12px; align-items: baseline;
    padding: 8px 12px; border-radius: 12px; border: 2px solid var(--grid);
  }
  .review .n { font-family: "Fredoka", "Trebuchet MS", sans-serif; font-weight: 700; font-size: 1.3rem; min-width: 44px; }

  body { overflow-x: hidden; }
  .tile-row { position: relative; }

  /* bonuses and power-ups */
  .badges { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; justify-content: center; }
  .panel .badges { justify-content: flex-start; margin: 6px 0 18px; }
  .badge {
    font-family: "Fredoka", "Trebuchet MS", sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
    padding: 8px 16px;
    border-radius: 999px;
    border: 3px solid var(--tile-edge);
    box-shadow: 0 4px 0 var(--tile-edge);
    animation: badgeIn 520ms cubic-bezier(.2, 1.4, .4, 1) both;
  }
  .badge:nth-child(2) { animation-delay: 220ms; }
  .badge.power { background: var(--power); color: var(--power-ink); }
  .badge.streak { background: var(--streak); color: var(--streak-ink); }
  @keyframes badgeIn {
    0% { transform: scale(0.2) rotate(-14deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  .hint { text-align: center; margin: 10px 0 0; color: var(--ink-soft); font-size: 1rem; }

  .note.power { background: var(--power-bg); border-left-color: var(--power); }
  .powerhint {
    margin: -4px 0 16px;
    padding: 8px 14px;
    text-align: center;
    font-size: 1rem;
    border-radius: 14px;
    border: 2px solid var(--power);
    background: var(--power-bg);
  }
  .def.s { background: color-mix(in srgb, var(--streak) 25%, var(--tile)); }
  .def.w { background: color-mix(in srgb, var(--power) 18%, var(--tile)); }

  .tile.powered {
    animation: powerUp 850ms ease-out;
    box-shadow: 0 8px 0 var(--tile-edge), 0 0 0 6px var(--power), 0 0 30px 8px var(--power);
  }
  .tile.hot {
    animation: powerUp 700ms ease-out;
    box-shadow: 0 8px 0 var(--tile-edge), 0 0 0 6px var(--streak), 0 0 26px 6px var(--streak);
  }
  @keyframes powerUp {
    0% { transform: rotate(-1.5deg) scale(1); }
    30% { transform: rotate(4deg) scale(1.14); }
    60% { transform: rotate(-5deg) scale(1.08); }
    100% { transform: rotate(-1.5deg) scale(1); }
  }

  .spark {
    position: absolute; left: 50%; top: 50%;
    width: 12px; height: 12px; border-radius: 3px;
    pointer-events: none;
    animation: fly 950ms ease-out forwards;
  }
  .spark.power { background: var(--power); }
  .spark.streak { background: var(--streak); }
  .spark.alt { background: var(--yellow); }
  @keyframes fly {
    0% { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.3) rotate(240deg); opacity: 0; }
  }
  .float {
    position: absolute; left: 50%; top: -10px;
    font-family: "Fredoka", "Trebuchet MS", sans-serif;
    font-weight: 700; font-size: 2.4rem;
    pointer-events: none;
    text-shadow: 0 2px 0 var(--paper), 0 -2px 0 var(--paper), 2px 0 0 var(--paper), -2px 0 0 var(--paper);
    animation: floatUp 1300ms ease-out forwards;
  }
  .float.power { color: var(--power); }
  .float.streak { color: var(--streak); }
  @keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%, 24px) scale(0.6); }
    20% { opacity: 1; transform: translate(-50%, 0) scale(1.25); }
    100% { opacity: 0; transform: translate(-50%, -60px) scale(1); }
  }
  .score .pts.bump { display: inline-block; color: var(--power); animation: bump 750ms ease-out; }
  @keyframes bump {
    0% { transform: scale(1); }
    35% { transform: scale(1.8); }
    100% { transform: scale(1); }
  }

  /* cat card prize */
  .prize {
    --c: var(--ink-soft);
    position: relative;
    text-align: center;
    margin: 8px 0 18px;
    padding: 26px 16px 20px;
    border: 3px solid var(--tile-edge);
    border-radius: 20px;
    background: color-mix(in srgb, var(--c) 22%, var(--tile));
    box-shadow: 0 6px 0 var(--tile-edge);
    animation: prizeIn 700ms cubic-bezier(.2, 1.3, .4, 1) both;
  }
  .prize.t1 { --c: var(--good); }
  .prize.t2 { --c: var(--blue); }
  .prize.t3 { --c: var(--streak); }
  .prize.t4 { --c: var(--power); }
  .prize.t5 { --c: var(--yellow); }
  .prize .rarity {
    position: absolute; top: -15px; left: 50%;
    transform: translateX(-50%);
    background: var(--tile); color: var(--ink);
    border: 3px solid var(--c);
    border-radius: 999px;
    padding: 1px 14px;
    font-family: "Fredoka", "Trebuchet MS", sans-serif;
    font-weight: 700; font-size: 0.95rem;
    white-space: nowrap;
  }
  .prize .emoji {
    display: inline-block;
    font-size: 5rem; line-height: 1.15;
    animation: wiggle 1.4s ease-in-out 0.6s 2;
  }
  .prize h3 {
    font-family: "Fredoka", "Trebuchet MS", sans-serif;
    font-size: 1.6rem; margin: 2px 0 6px;
  }
  .prize p { margin: 0 0 12px; font-size: 1.05rem; }
  .prize .newtag {
    display: inline-block;
    font-family: "Fredoka", "Trebuchet MS", sans-serif;
    font-weight: 700; font-size: 0.95rem;
    padding: 2px 14px; border-radius: 999px;
    background: var(--ink); color: var(--tile);
  }
  @keyframes prizeIn {
    0% { transform: scale(0.4) rotate(-10deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0); }
    25% { transform: rotate(-12deg) scale(1.1); }
    75% { transform: rotate(12deg) scale(1.1); }
  }
  .coll { display: flex; gap: 8px; justify-content: center; margin: 0 0 6px; flex-wrap: wrap; }
  .slot {
    width: 46px; height: 46px;
    display: grid; place-items: center;
    font-size: 1.6rem;
    border: 2px solid var(--tile-edge);
    border-radius: 12px;
    background: var(--tile);
  }
  .slot.locked {
    opacity: 0.5; border-style: dashed;
    font-family: "Fredoka", "Trebuchet MS", sans-serif; font-size: 1.2rem; font-weight: 700;
  }
  .slot.now { outline: 3px solid var(--yellow); outline-offset: 2px; }

  /* level menu */
  .level-grid { display: grid; gap: 16px; margin-top: 16px; }
  .btn.level {
    display: block;
    width: 100%;
    text-align: left;
    padding: 16px 18px;
    border-radius: 18px;
  }
  .btn.level .sub {
    display: block;
    margin-top: 4px;
    font-family: "Atkinson Hyperlegible", "Trebuchet MS", Verdana, sans-serif;
    font-weight: 400;
    font-size: 1rem;
    line-height: 1.4;
  }
  .btn.level.l1 { background: color-mix(in srgb, var(--blue) 18%, var(--tile)); }
  .btn.level.l2 { background: color-mix(in srgb, var(--yellow) 32%, var(--tile)); }
  .btn.level.l3 { background: color-mix(in srgb, var(--power) 18%, var(--tile)); }
  .whole { display: inline-block; }

  /* fractions */
  .tile.eqtile {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    min-width: 0;
    font-size: 3rem;
    padding: 14px 24px 18px;
  }
  .tile.eqtile .sym { font-size: 2.6rem; }
  .frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.05; }
  .frac .fn { padding: 0 10px 2px; border-bottom: 4px solid currentColor; }
  .frac .fd { padding: 2px 10px 0; }
  .eq .stack { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; }
  .eq .stack .rule { width: 100%; height: 4px; border-radius: 2px; background: var(--ink); }
  @media (max-width: 420px) {
    .tile.eqtile { font-size: 2.3rem; gap: 10px; padding: 12px 16px 16px; }
    .tile.eqtile .sym { font-size: 2rem; }
  }

  .site-foot {
    margin-top: 40px;
    text-align: center;
    font-size: 0.9rem;
    color: var(--ink-soft);
  }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 420px) {
    .tile { font-size: 5.2rem; min-width: 140px; }
    .eq input { width: 78px; font-size: 1.9rem; }
    .eq .op, .eq .res { font-size: 1.9rem; }
    .btn { font-size: 1.2rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile.pop { animation: none; }
    .tile.powered, .tile.hot, .badge, .score .pts.bump { animation: none; }
    .spark, .float { display: none; }
    .prize, .prize .emoji { animation: none; }
    .btn { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="title">Wildcat math</h1>
    <div class="bar" id="bar" hidden></div>
  </header>
  <main id="app"></main>
  <div class="sr" id="live" aria-live="polite"></div>
  <footer class="site-foot">Built by Pixel and Pines Labs</footer>
</div>

<script>
(function () {
  var TOTAL = 10;
  var G = null;
  var MODE = 'primes';
  var app = document.getElementById('app');
  var bar = document.getElementById('bar');
  var live = document.getElementById('live');
  var titleEl = document.getElementById('title');

  /* ---------- math helpers ---------- */
  function isPrime(n) {
    if (n < 2) return false;
    for (var i = 2; i * i <= n; i++) if (n % i === 0) return false;
    return true;
  }
  function pairs(n) {
    var r = [];
    for (var a = 2; a * a <= n; a++) if (n % a === 0) r.push([a, n / a]);
    return r;
  }
  function smallestFactor(n) {
    for (var i = 2; i * i <= n; i++) if (n % i === 0) return i;
    return n;
  }
  function pairsText(n) {
    return pairs(n).map(function (p) { return p[0] + ' × ' + p[1]; }).join(', ');
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pickNumbers() {
    var primes = [], comps = [];
    for (var n = 2; n <= 100; n++) (isPrime(n) ? primes : comps).push(n);
    shuffle(primes); shuffle(comps);
    var out = [];
    for (var i = 0; i < TOTAL; i++) {
      var wantPrime = Math.random() < 0.4;
      var src = (wantPrime && primes.length) ? primes : comps;
      out.push(src.pop());
    }
    return out;
  }

  /* ---------- best score (optional, per browser) ---------- */
  function bestKey(m) {
    m = m || MODE;
    return m === 'fractions' ? 'fraction-game-best-total'
      : m === 'multiply' ? 'fraction-multiply-best-total'
      : 'prime-game-best-total';
  }
  function getBest(m) {
    try { var v = localStorage.getItem(bestKey(m)); return v ? parseInt(v, 10) : null; }
    catch (e) { return null; }
  }
  function setBest(v) {
    try { localStorage.setItem(bestKey(), String(v)); } catch (e) {}
  }

  /* ---------- bonuses ---------- */
  function isBigPrime(x) { return x > 5 && isPrime(x); }
  function bigPrimeFactors(n) {
    var r = [];
    for (var p = 7; p <= n; p++) if (n % p === 0 && isPrime(p)) r.push(p);
    return r;
  }
  function powerPairsText(n) {
    return pairs(n).filter(function (p) { return isBigPrime(p[0]) || isBigPrime(p[1]); })
      .map(function (p) { return p[0] + ' × ' + p[1]; }).join(' or ');
  }
  function streakBonus(s) { return s >= 5 ? 2 : s >= 3 ? 1 : 0; }

  // power: 0 = none, 1 = one prime above 5, 2 = both factors are primes above 5
  function earn(power, label) {
    var items = [], total = 0, hint = '';
    if (power) {
      var pts = power === 2 ? 4 : 2;
      total += pts;
      G.powerCount += 1;
      items.push({ cls: 'power', text: label ? (label + ' +' + pts) : ((power === 2 ? '⚡⚡ Mega power-up! +' : '⚡ Power-up! +') + pts) });
    }
    var sb = streakBonus(G.streak);
    if (sb) {
      total += sb;
      items.push({ cls: 'streak', text: '🔥 Streak ×' + G.streak + ' +' + sb });
    }
    if (G.streak > G.maxStreak) G.maxStreak = G.streak;
    if (G.streak === 2) hint = 'One more in a row to start a streak bonus!';

  /* ---------- fractions level ---------- */
  var MINUS = '−';
  function gcd(a, b) { while (b) { var t = a % b; a = b; b = t; } return a; }
  function lcm(a, b) { return a / gcd(a, b) * b; }
  function fracHtml(n, d) {
    return '<span class="frac"><span class="fn">' + n + '</span><span class="fd">' + d + '</span></span>';
  }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function buildFrac(x1, y1, x2, y2, op) {
    var L = lcm(y1, y2);
    var e1 = x1 * (L / y1), e2 = x2 * (L / y2);
    var raw = op === '+' ? e1 + e2 : e1 - e2;
    var g = gcd(raw, L);
    return {
      x1: x1, y1: y1, x2: x2, y2: y2, op: op, L: L, e1: e1, e2: e2,
      raw: raw, g: g, sn: raw / g, sd: L / g, needs: g > 1,
      key: x1 + '/' + y1 + op + x2 + '/' + y2
    };
  }

  function genFrac(stage, want) {
    var y1, y2, k, base;
    if (stage === 1) {
      y1 = y2 = 4 + Math.floor(Math.random() * 9);
    } else if (stage === 2) {
      base = 2 + Math.floor(Math.random() * 5);
      k = (base * 3 <= 12 && Math.random() < 0.5) ? 3 : 2;
      y1 = base; y2 = base * k;
      if (Math.random() < 0.5) { var t = y1; y1 = y2; y2 = t; }
    } else {
      var pool = [2, 3, 4, 5, 6, 8, 9, 10];
      do { y1 = pick(pool); y2 = pick(pool); }
      while (y1 === y2 || y1 % y2 === 0 || y2 % y1 === 0);
    }
    var x1 = 1 + Math.floor(Math.random() * (y1 - 1));
    var x2 = 1 + Math.floor(Math.random() * (y2 - 1));
    var minus = Math.random() < 0.5;
    if (minus) {
      var a = x1 * y2, b = x2 * y1;
      if (a === b) return null;
      if (a < b) { var tx = x1; x1 = x2; x2 = tx; var ty = y1; y1 = y2; y2 = ty; }
    }
    var p = buildFrac(x1, y1, x2, y2, minus ? '-' : '+');
    p.op = minus ? MINUS : '+';
    if (p.sd === 1) return null;
    if (want !== null && p.needs !== want) return null;
    return p;
  }

  function buildMul(x1, y1, x2, y2) {
    var raw = x1 * x2, L = y1 * y2, g = gcd(raw, L);
    return {
      kind: 'mul', x1: x1, y1: y1, x2: x2, y2: y2, op: '×', L: L,
      raw: raw, g: g, sn: raw / g, sd: L / g, needs: g > 1,
      key: x1 + '/' + y1 + 'x' + x2 + '/' + y2
    };
  }
  function rnd(lo, hi) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }

  function genMul(stage, want) {
    var x1, y1, x2, y2;
    if (stage === 1) {
      y1 = rnd(2, 6); y2 = rnd(2, 6);
      x1 = rnd(1, y1 - 1); x2 = rnd(1, y2 - 1);
    } else if (stage === 2) {
      y1 = rnd(3, 10); y2 = rnd(3, 10);
      x1 = rnd(1, y1 - 1); x2 = rnd(1, y2 - 1);
    } else {
      x1 = rnd(2, 6); y1 = 1;
      y2 = rnd(3, 10); x2 = rnd(1, y2 - 1);
      if (Math.random() < 0.5) { var tx = x1; x1 = x2; x2 = tx; var ty = y1; y1 = y2; y2 = ty; }
    }
    var p = buildMul(x1, y1, x2, y2);
    if (p.sd === 1) return null;
    if (want !== null && p.needs !== want) return null;
    return p;
  }

  function makeMulProblems() {
    var out = [], seen = {};
    for (var r = 0; r < TOTAL; r++) {
      var stage = r < 3 ? 1 : r < 6 ? 2 : 3;
      var want = stage === 2 ? Math.random() < 0.8 : Math.random() < 0.55;
      var p = null, tries = 0;
      while (!p && tries < 400) {
        tries++;
        var cand = genMul(stage, tries > 200 ? null : want);
        if (cand && !seen[cand.key]) p = cand;
      }
      if (!p) { p = buildMul(1, 2, 1, 3); }
      p.stage = stage;
      seen[p.key] = true;
      out.push(p);
    }
    return out;
  }

  function makeProblems() {
    if (MODE === 'multiply') return makeMulProblems();
    var out = [], seen = {};
    for (var r = 0; r < TOTAL; r++) {
      var stage = r < 3 ? 1 : r < 6 ? 2 : 3;
      var want = Math.random() < 0.55;
      var p = null, tries = 0;
      while (!p && tries < 400) {
        tries++;
        var cand = genFrac(stage, tries > 200 ? null : want);
        if (cand && !seen[cand.key]) p = cand;
      }
      if (!p) { p = buildFrac(1, 4, 1, 4, '+'); }
      p.stage = stage;
      seen[p.key] = true;
      out.push(p);
    }
    return out;
  }

  function termText(x, y) { return y === 1 ? String(x) : x + '/' + y; }
  function termHtml(x, y) { return y === 1 ? '<span class="whole">' + x + '</span>' : fracHtml(x, y); }
  function termSpoken(x, y) { return y === 1 ? String(x) : x + ' over ' + y; }

  function stageLabel(s, p) {
    if (p && p.kind === 'mul') {
      return s === 1 ? 'Multiply the tops, multiply the bottoms'
        : s === 2 ? 'Bigger numbers: simplify the answer'
        : 'A whole number times a fraction';
    }
    return s === 1 ? 'Same bottom numbers'
      : s === 2 ? 'One bottom number fits into the other'
      : 'Different bottom numbers: find a common one';
  }
  function fracText(p) { return termText(p.x1, p.y1) + ' ' + p.op + ' ' + termText(p.x2, p.y2); }
  function opWord(p) { return p.op === '+' ? 'add' : 'subtract'; }

  function workHtml(p) {
    var s;
    if (p.kind === 'mul') {
      s = '';
      if (p.y1 === 1) s += 'Write ' + p.x1 + ' as ' + p.x1 + '/1. ';
      if (p.y2 === 1) s += 'Write ' + p.x2 + ' as ' + p.x2 + '/1. ';
      s += 'Tops: ' + p.x1 + ' × ' + p.x2 + ' = ' + p.raw + '. Bottoms: ' + p.y1 + ' × ' + p.y2 + ' = ' + p.L + '. That makes ' + p.raw + '/' + p.L + '.';
    } else if (p.y1 === p.y2) {
      s = p.x1 + '/' + p.y1 + ' ' + p.op + ' ' + p.x2 + '/' + p.y2 + ' = ' + p.raw + '/' + p.L;
    } else {
      s = 'Common bottom number ' + p.L + ': ' + p.e1 + '/' + p.L + ' ' + p.op + ' ' + p.e2 + '/' + p.L + ' = ' + p.raw + '/' + p.L;
    }
    if (p.g > 1) s += '<br>Simplify: divide the top and bottom by ' + p.g + ' to get ' + p.sn + '/' + p.sd + '.';
    return s;
  }

  function fracReview() {
    if (!G.missed.length) return '<p>You got every problem right.</p>';
    return '<p>Problems to practice:</p><ul class="review">' +
      G.missed.map(function (p) {
        return '<li><span>' + fracText(p) + ' = <b>' + p.sn + '/' + p.sd + '</b></span></li>';
      }).join('') + '</ul>';
  }

  function startFractions() {
    G = {
      probs: makeProblems(), i: 0, points: 0, bonus: 0, bump: false, powerCount: 0,
      maxStreak: 0, max: TOTAL, streak: 0, outcomes: [], missed: [], attempts: 0, nudges: 0
    };
    renderFracRound();
  }

  function renderFracRound() {
    var p = G.probs[G.i];
    G.attempts = 0;
    G.nudges = 0;
    renderBar();
    var spoken = termSpoken(p.x1, p.y1) + (p.op === '+' ? ' plus ' : p.op === '×' ? ' times ' : ' minus ') + termSpoken(p.x2, p.y2);
    app.innerHTML =
      '<div class="tile-row"><div class="tile eqtile pop" role="img" aria-label="' + spoken + '">' +
        termHtml(p.x1, p.y1) + '<span class="sym" aria-hidden="true">' + p.op + '</span>' + termHtml(p.x2, p.y2) +
      '</div></div>' +
      '<p class="hint">' + stageLabel(p.stage, p) + '</p>' +
      '<div class="stage" id="stage">' +
        '<p class="prompt">Solve it. Write the answer in simplest terms.</p>' +
        '<div class="eq">' +
          '<span class="op" aria-hidden="true">=</span>' +
          '<span class="stack">' +
            '<input id="fn" type="number" inputmode="numeric" min="0" aria-label="Top number" autocomplete="off">' +
            '<span class="rule" aria-hidden="true"></span>' +
            '<input id="fd" type="number" inputmode="numeric" min="1" aria-label="Bottom number" autocomplete="off">' +
          '</span>' +
        '</div>' +
        '<div class="actions">' +
          '<button class="btn go" id="check">Check</button>' +
          '<button class="btn ghost" id="reveal">Show me</button>' +
        '</div>' +
        '<div id="msg"></div>' +
      '</div>';
    var fn = document.getElementById('fn');
    var fd = document.getElementById('fd');
    document.getElementById('check').addEventListener('click', checkFrac);
    document.getElementById('reveal').addEventListener('click', function () { revealFrac(); });
    fn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); if (fn.value === '') return; if (fd.value === '') fd.focus(); else checkFrac(); }
    });
    fd.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); checkFrac(); }
    });
    fn.focus({ preventScroll: true });
    live.textContent = 'Problem ' + (G.i + 1) + '. ' + spoken + '.';
  }

  function checkFrac() {
    var p = G.probs[G.i];
    var fn = document.getElementById('fn');
    var fd = document.getElementById('fd');
    var n = parseInt(fn.value, 10);
    var d = parseInt(fd.value, 10);

    if (isNaN(n) || isNaN(d)) {
      setMsg('Type a number in the top box and the bottom box.', '');
      (isNaN(n) ? fn : fd).focus();
      return;
    }
    if (d < 1) {
      setMsg('The bottom number has to be at least 1.', '');
      fd.focus();
      return;
    }

    if (n * p.sd === p.sn * d) {
      var g = gcd(n, d);
      if (g > 1) {
        G.nudges += 1;
        setMsg(G.nudges === 1
          ? '<strong>Right amount!</strong> But ' + n + '/' + d + ' isn’t in simplest terms yet. Can you divide the top and bottom by the same number?'
          : '<strong>Still not simplest.</strong> Both ' + n + ' and ' + d + ' can be divided by ' + g + '.', '');
        fn.focus();
        fn.select();
        return;
      }
      G.points += 1;
      G.streak += 1;
      G.outcomes[G.i] = 'good';
      var sharp = p.needs && G.nudges === 0;
      var r = earn(sharp ? 1 : 0, sharp ? '✂️ Sharp claws!' : '');
      renderBar();
      var tip = (p.needs && !sharp)
        ? '<div class="note power" role="status"><strong>✂️ Sharp claws were waiting.</strong> This one simplifies to ' + p.sn + '/' + p.sd + '. Shrink it before you check and you earn +2.</div>'
        : '';
      document.getElementById('stage').innerHTML =
        '<div class="note good" role="status"><strong>Nice! ' + fracText(p) + ' = ' + p.sn + '/' + p.sd + '.</strong><br>' + workHtml(p) + '</div>' +
        badgesHtml(r) +
        tip +
        nextButton();
      wireNext();
      fx(r);
      return;
    }

    G.attempts += 1;
    if (G.attempts >= 3) {
      revealFrac(n + '/' + d + ' isn’t right.');
      return;
    }
    var text;
    if (p.kind === 'mul') {
      var wholeTip = p.y1 === 1 ? 'Write ' + p.x1 + ' as ' + p.x1 + '/1 first. '
        : p.y2 === 1 ? 'Write ' + p.x2 + ' as ' + p.x2 + '/1 first. ' : '';
      if (d === p.y1 + p.y2 || n === p.x1 + p.x2) {
        text = 'Careful: this is multiplying, not adding. ' + wholeTip + 'Multiply the tops together and the bottoms together.';
      } else if (G.attempts === 1) {
        text = wholeTip + 'Multiply the tops (' + p.x1 + ' × ' + p.x2 + ') and the bottoms (' + p.y1 + ' × ' + p.y2 + ').';
      } else {
        text = 'Tops: ' + p.x1 + ' × ' + p.x2 + ' = ' + p.raw + '. Bottoms: ' + p.y1 + ' × ' + p.y2 + ' = ' + p.L + '. Simplify if you can.';
      }
    } else if (d === p.y1 + p.y2) {
      text = p.y1 === p.y2
        ? 'The bottom number stays the same when the pieces are already the same size. Only the tops change.'
        : 'Careful: don’t add the bottom numbers. They show the size of the pieces, so make the pieces match first.';
    } else if (G.attempts === 1) {
      text = p.y1 === p.y2
        ? 'The bottom numbers match, so ' + opWord(p) + ' the tops and keep the bottom number.'
        : 'Make the bottom numbers match first. A common bottom number here is ' + p.L + '.';
    } else {
      text = p.y1 === p.y2
        ? p.x1 + ' ' + p.op + ' ' + p.x2 + ' = ' + p.raw + ', so the top is ' + p.raw + '. Simplify if you can.'
        : p.x1 + '/' + p.y1 + ' = ' + p.e1 + '/' + p.L + ' and ' + p.x2 + '/' + p.y2 + ' = ' + p.e2 + '/' + p.L + '. Now ' + opWord(p) + ' the tops.';
    }
    setMsg('<strong>Not quite.</strong> ' + n + '/' + d + ' isn’t it. Hint: ' + text, 'bad');
    fn.focus();
    fn.select();
  }

  function revealFrac(prefix) {
    var p = G.probs[G.i];
    G.streak = 0;
    G.outcomes[G.i] = 'miss';
    G.missed.push(p);
    renderBar();
    document.getElementById('stage').innerHTML =
      '<div class="note bad" role="status">' + (prefix ? prefix + '<br>' : '') +
      '<strong>Here’s how it works:</strong><br>' + workHtml(p) +
      '<br>Answer: <b>' + p.sn + '/' + p.sd + '</b></div>' +
      nextButton();
    wireNext();
  }

  /* ---------- cat card prizes ---------- */
  var TIERS = [
    { id: 'house', level: 0, emoji: '🐱', rarity: 'Common', name: 'Common House Cat',
      line: 'You’ve unlocked the common house cat! Mostly naps, sometimes knocks a cup off the table. Wildcat training starts now.' },
    { id: 'kitten', level: 1, emoji: '😸', rarity: 'Uncommon', name: 'Playful Kitten',
      line: 'You’ve unlocked the playful kitten! Great at chasing laser dots, getting better at chasing factors.' },
    { id: 'alley', level: 2, emoji: '🐈', rarity: 'Rare', name: 'Sneaky Alley Cat',
      line: 'You’ve unlocked the sneaky alley cat! Street smart, snack smart, and getting math smart.' },
    { id: 'bobcat', level: 3, emoji: '😼', rarity: 'Super rare', name: 'Smug Bobcat',
      line: 'You’ve unlocked the smug bobcat! It knows it’s good at this, and it isn’t shy about it.' },
    { id: 'cougar', level: 4, emoji: '🦁', rarity: 'Epic', name: 'Mighty Mountain Lion',
      line: 'You’ve unlocked the mountain lion! Silent, speedy, and scary good at multiplication.' },
    { id: 'wildcat', level: 5, emoji: '🐆', rarity: 'Legendary', name: 'Fierce Wildcat',
      line: 'You’ve unlocked the fierce Wildcat! A perfect game. Prime numbers hide when they hear you coming.' }
  ];
  TIERS[1].fline = 'You’ve unlocked the playful kitten! Great at chasing laser dots, getting better at chasing common denominators.';
  TIERS[4].fline = 'You’ve unlocked the mountain lion! Silent, speedy, and scary good at fractions.';
  TIERS[1].mline = 'You’ve unlocked the playful kitten! Great at chasing laser dots, getting better at multiplying fractions.';
  TIERS[4].mline = TIERS[4].line;
  TIERS[5].mline = 'You’ve unlocked the fierce Wildcat! A perfect game. Fractions multiply and shrink when they hear you coming.';
  TIERS[5].fline = 'You’ve unlocked the fierce Wildcat! A perfect game. Fractions shrink to simplest terms when they hear you coming.';
  function tierFor(p) {
    var l = p >= 100 ? 5 : p >= 90 ? 4 : p >= 75 ? 3 : p >= 55 ? 2 : p >= 35 ? 1 : 0;
    return TIERS[l];
  }
  function getCards() {
    try {
      var v = JSON.parse(localStorage.getItem('prime-game-cards') || '[]');
      return Array.isArray(v) ? v : [];
    } catch (e) { return []; }
  }
  function saveCards(a) {
    try { localStorage.setItem('prime-game-cards', JSON.stringify(a)); } catch (e) {}
  }
  function prizeBurst(level) {
    if (level < 3) return;
    var pz = document.querySelector('.prize');
    if (!pz) return;
    var kinds = ['alt', 'power', 'streak'];
    var count = level === 5 ? 32 : 18;
    for (var k = 0; k < count; k++) {
      var s = document.createElement('span');
      var ang = (Math.PI * 2 * k) / count + Math.random() * 0.3;
      var dist = 120 + Math.random() * 120;
      s.className = 'spark ' + kinds[k % 3];
      s.style.setProperty('--dx', Math.round(Math.cos(ang) * dist) + 'px');
      s.style.setProperty('--dy', Math.round(Math.sin(ang) * dist) + 'px');
      pz.appendChild(s);
      (function (el) { setTimeout(function () { el.remove(); }, 1000); })(s);
    }
  }

  function showEnd() {
    G.i = TOTAL;
    renderBar();
    var pct = Math.round((G.points / G.max) * 100);
    var total = G.points + G.bonus;
    var prevBest = getBest();
    var newBest = prevBest === null || total > prevBest;
    if (newBest) setBest(total);

    var headline = pct === 100 ? 'Perfect game!' : pct >= 80 ? 'Great work!' : pct >= 50 ? 'Good start!' : 'Keep practicing!';
    var tier = tierFor(pct);
    var owned = getCards();
    var isNew = owned.indexOf(tier.id) === -1;
    if (isNew) { owned = owned.concat([tier.id]); saveCards(owned); }
    var prize =
      '<div class="prize t' + tier.level + '">' +
        '<span class="rarity">' + tier.rarity + '</span>' +
        '<div class="emoji" aria-hidden="true">' + tier.emoji + '</div>' +
        '<h3>' + tier.name + '</h3>' +
        '<p>' + ((MODE === 'multiply' && tier.mline) || (MODE !== 'primes' && tier.fline) || tier.line) + '</p>' +
        '<span class="newtag">' + (isNew ? 'New card!' : 'Already in your collection') + '</span>' +
      '</div>';
    var coll =
      '<div class="coll" role="list" aria-label="Cat card collection">' +
      TIERS.map(function (t) {
        var has = owned.indexOf(t.id) !== -1;
        return '<span class="slot' + (has ? '' : ' locked') + (t.id === tier.id ? ' now' : '') + '" role="listitem" title="' + (has ? t.name : 'Locked') + '" aria-label="' + (has ? t.name : 'Locked card') + '">' + (has ? t.emoji : '?') + '</span>';
      }).join('') +
      '</div><p class="hint">Cat cards collected: ' + owned.length + ' of ' + TIERS.length + '</p>';
    var review = '';
    if (MODE !== 'primes') {
      review = fracReview();
    } else if (G.missed.length) {
      review = '<p>Numbers to practice:</p><ul class="review">' +
        G.missed.map(function (n) {
          return '<li><span class="n">' + n + '</span><span>' +
            (isPrime(n) ? 'Prime. Only 1 × ' + n + '.' : 'Composite: ' + pairsText(n)) + '</span></li>';
        }).join('') + '</ul>';
    } else {
      review = '<p>You got every number right.</p>';
    }

    app.innerHTML =
      '<section class="panel">' +
        prize + coll + '<h2>' + headline + '</h2>' +
        '<div class="big">' + total + ' points</div>' +
        '<p>' + G.points + ' of ' + G.max + ' base points + ' + G.bonus + ' bonus points' + (newBest && prevBest !== null ? ' (a new best!)' : prevBest !== null ? ' (best: ' + prevBest + ')' : '') + '</p>' +
        '<div class="badges"><span class="badge streak">🔥 Best streak: ' + G.maxStreak + '</span><span class="badge power">' + (MODE !== 'primes' ? '✂️ Sharp claws: ' : '⚡ Power-ups: ') + G.powerCount + '</span></div>' +
        review +
        '<div class="actions"><button class="btn go" id="again">Play again</button><button class="btn ghost" id="menu">Change level</button></div>' +
      '</section>';
    var again = document.getElementById('again');
    document.getElementById('menu').addEventListener('click', showMenu);
    again.addEventListener('click', startGame);
    again.focus({ preventScroll: true });
    window.scrollTo(0, 0);
    prizeBurst(tier.level);
    live.textContent = 'Game over. You scored ' + total + ' points, including ' + G.bonus + ' bonus points.';
  }

  showMenu();
})();
</script>
</body>
</html>
